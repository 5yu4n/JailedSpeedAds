name: Build adspeed dylib

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Theos
        uses: beerpiss/theos-action@v1

      - name: Build tweak and package
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make package FINALPACKAGE=1

          mkdir -p dist
          dylib_path="$(find .theos -type f -name 'adspeed.dylib' -print -quit)"
          if [[ -z "$dylib_path" ]]; then
            echo "adspeed.dylib was not produced by Theos."
            find .theos -maxdepth 5 -type f -print || true
            exit 1
          fi

          cp "$dylib_path" dist/adspeed.dylib

          echo "Inspecting Mach-O dependencies:"
          otool -L dist/adspeed.dylib
          if otool -L dist/adspeed.dylib | grep -q "CydiaSubstrate"; then
            echo "Unexpected CydiaSubstrate dependency remains."
            exit 1
          fi
          if nm -u dist/adspeed.dylib | grep -q "MSHookMessageEx"; then
            echo "Unexpected unresolved MSHookMessageEx symbol remains."
            exit 1
          fi

          find packages -maxdepth 1 -type f -name '*.deb' -exec cp {} dist/ \\; 2>/dev/null || true
          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adspeed-build
          path: dist/*
          if-no-files-found: error
          retention-days: 14
