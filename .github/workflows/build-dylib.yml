name: Build jailed dylib

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build tweak
        run: |
          make clean
          make FINALPACKAGE=1

      - name: Locate dylib
        id: dylib
        shell: bash
        run: |
          DYLIB="$(find .theos -type f -name 'adspeed.dylib' -print -quit)"
          if [ -z "$DYLIB" ]; then
            echo "adspeed.dylib was not produced" >&2
            find .theos -maxdepth 5 -type f -print || true
            exit 1
          fi
          mkdir -p dist
          cp "$DYLIB" dist/adspeed.dylib
          echo "path=dist/adspeed.dylib" >> "$GITHUB_OUTPUT"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: adspeed-dylib
          path: ${{ steps.dylib.outputs.path }}
          if-no-files-found: error
          retention-days: 14
